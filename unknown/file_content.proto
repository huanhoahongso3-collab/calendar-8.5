edition = "2023";

package os_migration_data_types.v1;

import "export_failure.proto";

option java_multiple_files = true;

message FileContentIdentifier {
  // Size of the file in bytes.
  uint64 size = 1;

  // Uniquely identifies the contents of a file.
  bytes identifier = 2;
}

// Body to POST to /file-contents, requesting multiple file contents.
message FileContentBatchRequest {
  // List of identifiers of file contents to fetch.
  repeated bytes identifiers = 1;
}

message FileContentResponse {
  bytes identifier = 1;
  ExportFailure export_failure = 2;
}
